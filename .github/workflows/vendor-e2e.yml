name: vendor-e2e

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Adapter id to verify on the protected Windows runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline-real-binary:
    runs-on: [self-hosted, windows, multi-cli-vendor-test]
    steps:
      - uses: actions/checkout@v4
      - name: Run real binary offline smoke
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tests/e2e/windows/Invoke-VendorSmoke.ps1
          -Tool '${{ inputs.tool }}'
          -EvidenceDirectory "$env:RUNNER_TEMP\multi-cli-evidence"

  # Disabled until a protected self-hosted runner with disposable vendor
  # accounts exists; the job stays as the documented promotion-gate harness.
  authenticated-dual-account:
    if: ${{ false }}
    runs-on: [self-hosted, windows, multi-cli-protected-auth]
    steps:
      - uses: actions/checkout@v4
      - name: Protected authenticated gate
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tests/e2e/windows/Invoke-DualAccount.ps1
          -Protected
          -Manifest "$env:MULTICLI_E2E_MANIFEST"
